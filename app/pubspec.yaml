name: hifz_academy
description: Quran Hifz & Recitation Academy — Android and iOS.
publish_to: none
version: 0.13.0+16

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  supabase_flutter: ^2.8.0
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.0
  uuid: ^4.5.1
  just_audio: ">=0.9.40 <1.0.0"
  http: ^1.2.0
  package_info_plus: ">=8.0.0 <12.0.0"
  ota_update: ^7.1.0
  web: ^1.1.0
  speech_to_text: ^7.0.0
  record: ^6.0.0
  cross_file: ^0.3.4
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  geolocator: '>=13.0.0 <15.0.0'
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  # Later: audio_service (lock-screen playback), record (Phase 9), purchases_flutter (Phase 13)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/quran/
    - assets/translations/
    - assets/tafsir/
    - assets/sounds/
    - assets/changelog.json
  # Note: assets/quran/ holds the verified Tanzil text produced by tools/quran_import.
  # Fonts: add the files to assets/fonts/ and uncomment (see README, "Fonts").
  # fonts:
  #   - family: UthmanicHafs
  #     fonts:
  #       - asset: assets/fonts/UthmanicHafs_V22.ttf
  #   - family: NotoSansMalayalam
  #     fonts:
  #       - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
  #       - asset: assets/fonts/NotoSansMalayalam-SemiBold.ttf
  #         weight: 600

