name: Hifz Academy recitation teacher (Hugging Face Space)

on:
  push:
    branches: [hifz]
    paths: ['server/**', '.github/workflows/hifz-teacher.yml']
  workflow_dispatch:

concurrency: { group: hifz-teacher, cancel-in-progress: false }

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install -q -r server/requirements.txt httpx
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-muaalem-v3_2
      - name: Check the teacher on real recitations
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          python test_server.py 2>&1 | tee ../teacher-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: teacher-test, path: teacher-test.log }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Deploy to Modal and publish the address
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::warning::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET are not set, so the teacher was tested but not deployed."
            exit 0
          fi
          pip install -q modal
          cd server
          modal deploy modal_app.py 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.modal\.run' /tmp/deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::No endpoint address in the deploy output"; exit 1; }
          echo "Teacher at $URL"
          # Wake it and check it answers (first start loads the model).
          for i in $(seq 1 30); do
            if curl -fsS --max-time 60 "$URL/health" | tee /tmp/health.json | grep -q '"ready":true'; then break; fi
            sleep 10
          done
          cat /tmp/health.json; echo
          curl -fsSL "https://everyayah.com/data/Husary_Muallim_128kbps/112001.mp3" -o /tmp/a.mp3
          curl -fsS --max-time 240 -F "file=@/tmp/a.mp3" -F sura=112 -F aya=1 "$URL/check" | head -c 600; echo
          printf '{"teacher_url": "%s"}\n' "$URL" > /tmp/server.json
          git clone -q --depth 1 --branch hifz-builds "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/b
          cp /tmp/server.json /tmp/b/server.json
          cd /tmp/b && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add server.json && (git diff --cached --quiet || (git commit -qm "Teacher address" && git push -q origin hifz-builds))
