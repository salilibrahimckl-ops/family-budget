name: Build Hifz Academy (web + Android)
on:
  push:
    branches: [hifz]
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: hifz-${{ github.ref }}
  cancel-in-progress: true
env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Fetch translations (Tanzil.net)
        run: python3 -I tools/fetch_translations.py app/assets/translations 2>&1 | tee translations.log
      - name: Fetch explanations (QuranEnc.com) and plain spelling for recitation checks (Tanzil.net)
        run: python3 -I tools/fetch_tafsir.py app/assets 2>&1 | tee tafsir.log
      - name: Test and build web app
        shell: bash
        run: |
          set -o pipefail
          B=$((100 + BUILD_NUMBER))
          cd app
          {
            flutter create --platforms web --org com.salil --project-name hifz_academy .
            flutter pub get
            dart run flutter_launcher_icons -f icons_web.yaml
            flutter gen-l10n
            dart run sqflite_common_ffi_web:setup
            flutter analyze --no-fatal-infos
            flutter test
          } 2>&1 | tee ../build-web.log
          python3 - <<'PY'
          import json, re
          m = json.load(open('web/manifest.json'))
          m.update(name='Hifz Academy', short_name='Hifz', background_color='#FBF9F4',
                   theme_color='#0F5E50', display='standalone', orientation='portrait')
          json.dump(m, open('web/manifest.json', 'w'), indent=2)
          h = open('web/index.html').read()
          h = re.sub(r'<title>.*?</title>', '<title>Hifz Academy</title>', h)
          h = h.replace('content="hifz_academy"', 'content="Hifz Academy"')
          if 'theme-color' not in h:
              h = h.replace('<head>', '<head>\n  <meta name="theme-color" content="#0F5E50">', 1)
          open('web/index.html', 'w').write(h)
          PY
          flutter build web --release --base-href /family-budget/hifz/ --build-number=$B 2>&1 | tee -a ../build-web.log
          cat > build/web/flutter_service_worker.js <<'JS'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
              await self.registration.unregister();
              const clients = await self.clients.matchAll({ type: 'window' });
              clients.forEach((c) => c.navigate(c.url));
            })());
          });
          JS
          tar -czf ../hifz-web.tar.gz -C build/web .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web
          path: |
            hifz-web.tar.gz
            build-web.log
            translations.log
            tafsir.log
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Fetch translations (Tanzil.net)
        run: python3 -I tools/fetch_translations.py app/assets/translations
      - name: Fetch explanations and plain spelling
        run: python3 -I tools/fetch_tafsir.py app/assets
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          B=$((100 + BUILD_NUMBER))
          cd app
          {
            flutter create --platforms android --org com.salil --project-name hifz_academy .
            python3 -I ../tools/android/patch_android.py
            flutter pub get
            dart run flutter_launcher_icons -f icons_android.yaml
            flutter gen-l10n
            flutter build apk --release --build-number=$B
          } 2>&1 | tee ../build-android.log
          cp build/app/outputs/flutter-apk/app-release.apk ../HifzAcademy.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: |
            HifzAcademy.apk
            build-android.log
          if-no-files-found: ignore

  publish:
    needs: [web, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/art }
      - name: Publish to hifz-builds branch
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp /tmp/art/web/* /tmp/out/ 2>/dev/null || true
          cp /tmp/art/android/* /tmp/out/ 2>/dev/null || true
          B=$((100 + BUILD_NUMBER))
          V=$(grep -m1 '^version:' app/pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "web=${{ needs.web.result }} android=${{ needs.android.result }} build $B $(date -u)" > /tmp/out/STATUS
          if [ -f /tmp/out/HifzAcademy.apk ]; then
            python3 - "$B" "$V" <<'PY'
          import json, sys
          log = json.load(open('app/assets/changelog.json'))
          notes = next((e['notes'] for e in log if e['version'] == sys.argv[2]), [])
          json.dump({'build': int(sys.argv[1]), 'version': sys.argv[2], 'notes': notes},
                    open('/tmp/out/version.json', 'w'), ensure_ascii=False, indent=1)
          PY
          fi
          cd /tmp/out && git init -q && git checkout -q -b hifz-builds
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Hifz build $B (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hifz-builds
      - name: Redeploy the Pages site
        if: needs.web.result == 'success'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
