name: FITVERSE Android APK
on:
  push:
    branches: [fitverse]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fitverse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build APK
        shell: bash
        run: |
          set -eo pipefail
          {
            npm install --no-audit --no-fund
            FV_BUILD=${{ github.run_number }} npm run build
            npx cap add android
            npx cap sync android
            python3 scripts/patch-android.py ${{ github.run_number }}
            mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
            cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
            cp app/build/outputs/apk/debug/app-debug.apk ../FITVERSE.apk
          } 2>&1 | tee build.log
      - name: Publish APK to fitverse-builds branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out && cp build.log /tmp/out/ || true
          cp FITVERSE.apk /tmp/out/ 2>/dev/null || true
          cp www/index.html /tmp/out/fitverse-web.html 2>/dev/null || true
          if [ -f /tmp/out/FITVERSE.apk ]; then cp dist-ota/version.json dist-ota/bundle.json dist-ota/fitverse-pages.html /tmp/out/; fi
          echo "${{ job.status }} run ${{ github.run_number }} $(date -u)" > /tmp/out/STATUS
          cd /tmp/out && git init -q && git checkout -q -b fitverse-builds
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "FITVERSE build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fitverse-builds
