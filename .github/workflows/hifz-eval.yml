name: Hifz teacher stress test

on:
  workflow_dispatch:
  push:
    branches: [hifz]
    paths: ['.eval-run']

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5], denoise: ['1'] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install -q -r server/requirements.txt httpx
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-muaalem-v3_2
      - name: Run
        working-directory: server
        env: { HIFZ_DENOISE: '${{ matrix.denoise }}' }
        run: python eval.py ${{ matrix.shard }} 6
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.denoise }}-${{ matrix.shard }}
          path: server/eval-${{ matrix.denoise }}-${{ matrix.shard }}.json
  report:
    needs: eval
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: server/results }
      - name: Report
        working-directory: server
        run: python eval_report.py
