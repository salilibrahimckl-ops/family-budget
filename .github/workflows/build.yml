name: Build Family Budget apps (Android, iPhone, web)
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          BUILD_NUMBER=$((100 + ${{ github.run_number }})) bash setup.sh 2>&1 | tee build-android.log
      - name: Publish result to builds-android branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out && cp build-android.log /tmp/out/ || true
          cp FamilyBudget.apk /tmp/out/ 2>/dev/null || true
          echo "${{ job.status }} $(date -u)" > /tmp/out/STATUS
          if [ -f /tmp/out/FamilyBudget.apk ]; then
            echo "{\"build\": $((100 + ${{ github.run_number }})), \"sha\": \"${GITHUB_SHA::7}\"}" > /tmp/out/version.json
          fi
          cd /tmp/out && git init -q && git checkout -q -b builds-android
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Android build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds-android

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -o pipefail
          SKIP_APK=1 bash setup.sh 2>&1 | tee build-ios.log
          cd app
          flutter build ios --release --no-codesign 2>&1 | tee -a ../build-ios.log
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ../FamilyBudget.ipa Payload
      - name: Publish result to builds-ios branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/out && cp build-ios.log /tmp/out/ || true
          cp FamilyBudget.ipa /tmp/out/ 2>/dev/null || true
          echo "${{ job.status }} $(date -u)" > /tmp/out/STATUS
          cd /tmp/out && git init -q && git checkout -q -b builds-ios
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "iOS build ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds-ios

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build web app (for the iPhone home screen)
        shell: bash
        run: |
          set -o pipefail
          SKIP_APK=1 bash setup.sh 2>&1 | tee build-web.log
          cd app
          flutter create --platforms web . 2>&1 | tee -a ../build-web.log
          python3 - <<'PY'
          import json, re
          m = json.load(open('web/manifest.json'))
          m.update(name='Family Budget', short_name='Budget', background_color='#16808A',
                   theme_color='#16808A', display='standalone')
          json.dump(m, open('web/manifest.json', 'w'), indent=2)
          h = open('web/index.html').read()
          h = re.sub(r'<title>.*?</title>', '<title>Family Budget</title>', h)
          h = h.replace('content="family_budget"', 'content="Family Budget"')
          open('web/index.html', 'w').write(h)
          PY
          flutter build web --release --base-href /family-budget/ 2>&1 | tee -a ../build-web.log
          # Replace Flutter's offline cache with one that clears itself, so the
          # iPhone home-screen app always loads the newest version.
          cat > build/web/flutter_service_worker.js <<'JS'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
              await self.registration.unregister();
              const clients = await self.clients.matchAll({ type: 'window' });
              clients.forEach((c) => c.navigate(c.url));
            })());
          });
          JS
      - name: Add Bro’s Fitness web app at /fitness (iPhone home-screen app)
        shell: bash
        run: |
          mkdir -p app/build/web/fitness
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/fitverse-builds/fitverse-pages.html" -o app/build/web/fitness/index.html \
            || echo "Bro’s Fitness page not published yet - skipping"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/build/web }
      - id: deploy
        uses: actions/deploy-pages@v4
