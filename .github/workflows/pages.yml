name: Publish web apps (Family Budget, Bro's Fitness, Hifz Academy)
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build web app (for the iPhone home screen)
        shell: bash
        run: |
          set -o pipefail
          SKIP_APK=1 bash setup.sh 2>&1 | tee build-web.log
          cd app
          flutter create --platforms web . 2>&1 | tee -a ../build-web.log
          python3 - <<'PY'
          import json, re
          m = json.load(open('web/manifest.json'))
          m.update(name='Family Budget', short_name='Budget', background_color='#16808A',
                   theme_color='#16808A', display='standalone')
          json.dump(m, open('web/manifest.json', 'w'), indent=2)
          h = open('web/index.html').read()
          h = re.sub(r'<title>.*?</title>', '<title>Family Budget</title>', h)
          h = h.replace('content="family_budget"', 'content="Family Budget"')
          open('web/index.html', 'w').write(h)
          PY
          flutter build web --release --base-href /family-budget/ 2>&1 | tee -a ../build-web.log
          # Replace Flutter's offline cache with one that clears itself, so the
          # iPhone home-screen app always loads the newest version.
          cat > build/web/flutter_service_worker.js <<'JS'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
              await self.registration.unregister();
              const clients = await self.clients.matchAll({ type: 'window' });
              clients.forEach((c) => c.navigate(c.url));
            })());
          });
          JS
      - name: Add Bro’s Fitness web app at /fitness (iPhone home-screen app)
        shell: bash
        run: |
          mkdir -p app/build/web/fitness
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/fitverse-builds/fitverse-pages.html" -o app/build/web/fitness/index.html \
            || echo "Bro’s Fitness page not published yet - skipping"
      - name: Add Hifz Academy web app at /hifz (iPhone home-screen app)
        shell: bash
        run: |
          mkdir -p app/build/web/hifz
          if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/hifz-builds/hifz-web.tar.gz" -o /tmp/hifz-web.tar.gz; then
            tar -xzf /tmp/hifz-web.tar.gz -C app/build/web/hifz
          else
            echo "Hifz Academy not published yet - skipping"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/build/web }
      - id: deploy
        uses: actions/deploy-pages@v4
